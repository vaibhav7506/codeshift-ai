name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run deployment:validate
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run package:cli
      - run: npm run package:runner
      - name: Validate migration directory
        run: test ! -d migrations || find migrations -type f -name '*.sql' -print
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx > codeshift-sbom.json
      - name: Generate licence inventory
        run: npm run license:report > codeshift-licences.json
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-reports
          path: |
            codeshift-sbom.json
            codeshift-licences.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run security:secrets

  container:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: codeshift-ai:ci

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  release-artifacts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate, container, secret-scan, codeql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm pack --workspace=@codeshift/cli
      - run: npm pack --workspace=@codeshift/runner
      - uses: actions/upload-artifact@v4
        with:
          name: cli-package
          path: |
            apps/cli/*.tgz
            apps/runner/*.tgz
